version: "3.9"

services:
  backend:
    build: ./backend
    container_name: backend_app
    restart: always
    expose:
      - "3000"
    environment:
      DATABASE_URL: "postgresql://bifrosthub:BiFrost@1602@app.bifrosthub.com:5432/bifrost_hub?schema=public"
      HOST: 0.0.0.0
      PORT: 3000

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: nginx_app
    ports:
      - "5010:80"
    environment:      
      VITE_BACKEND_API_URL: /api
    depends_on:
      - backend
    restart: always
